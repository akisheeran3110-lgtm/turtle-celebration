<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- ピンチズーム/二本指ズームを禁止し、ゲームとしての操作感を確保 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Turtle Celebration</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #05131f;
        overscroll-behavior: none; /* iOS Safariのバウンススクロール抑制 */
        touch-action: none; /* ドラッグ操作をブラウザのスクロールに奪われないように */
      }
      #app {
        width: 100vw;
        height: 100dvh; /* iOS Safariのアドレスバー分の高さ揺れに対応 */
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
